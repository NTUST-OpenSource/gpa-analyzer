name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check --diff .

      - name: Tests
        run: uv run pytest -q

  assets:
    name: Verify built assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild stylesheet
        run: npm run build

      - name: Fail if static/vendor/tailwind.css is stale
        run: |
          if ! git diff --quiet -- static/vendor/tailwind.css; then
            echo "::error::static/vendor/tailwind.css is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- static/vendor/tailwind.css
            exit 1
          fi

      - name: Check app.js syntax
        run: node --check static/app.js

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: gpa-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          SECRET_KEY="$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          docker run -d --name gpaa -p 8000:8000 \
            -e SECRET_KEY="$SECRET_KEY" -e COOKIE_SECURE=false \
            gpa-analyzer:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then
              echo "container is healthy"
              docker rm -f gpaa
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy"
          docker logs gpaa
          docker rm -f gpaa
          exit 1
